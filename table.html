<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel</title>
</head>
<body>
    <h1>Tabel</h1>
    <table>
        <!--row =  baris tabel-->
        <tr>
            <!--table heading = th-->
            <th>No.</th>
            <th>Nama</th>
            <th>Lokasi</th>

        </tr>
        <tr>
            <!--td = Table Data-->
            <td>1.</td>
            <td>Rizal</td>
            <td>Cilacap</td>
        </tr>
    </table>
</body>
</html>
